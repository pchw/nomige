services:
  app:
    build: .
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      # ホストの node_modules と混ざらないよう、コンテナ専用の名前付きボリュームを使う
      - node_modules:/app/node_modules
      # wrangler login の認証情報をコンテナの作り直し後も残す
      - wrangler_config:/root/.config/.wrangler
    environment:
      # Docker Desktop のバインドマウントでファイル変更を確実に拾うため
      CHOKIDAR_USEPOLLING: "true"
      WRANGLER_SEND_METRICS: "false"
    tty: true
    stdin_open: true

volumes:
  node_modules:
  wrangler_config:
